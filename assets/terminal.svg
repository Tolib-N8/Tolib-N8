<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="tolib@dushanbe terminal: whoami — Tolib, Python and full-stack developer">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1e293b" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <!-- «Печать»: каждая команда открывается слева направо -->
    <clipPath id="t1"><rect x="0" y="0" height="330" width="0"><animate attributeName="width" from="0" to="1000" begin="0.4s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="0" y="0" height="330" width="0"><animate attributeName="width" from="0" to="1000" begin="2.0s" dur="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="0" y="0" height="330" width="0"><animate attributeName="width" from="0" to="1000" begin="3.8s" dur="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="0" y="0" height="330" width="0"><animate attributeName="width" from="0" to="1000" begin="5.6s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 17px; }
      .user { fill: #34d399; font-weight: 700; }
      .path { fill: #60a5fa; font-weight: 700; }
      .cmd  { fill: #e2e8f0; }
      .out  { fill: #94a3b8; }
      .hl   { fill: #22d3ee; }
      .pink { fill: #f472b6; }
      .cursor { fill: #22d3ee; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- окно -->
  <rect x="6" y="6" width="988" height="318" rx="16" fill="url(#bg)"/>
  <rect x="6" y="6" width="988" height="318" rx="16" fill="url(#grid)"/>
  <rect x="6" y="6" width="988" height="318" rx="16" fill="none" stroke="url(#border)" stroke-width="2" filter="url(#glow)"/>
  <rect x="7" y="44" width="986" height="60" fill="url(#scan)">
    <animate attributeName="y" values="44;300;44" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- заголовок окна -->
  <line x1="7" y1="44" x2="993" y2="44" stroke="#1e293b"/>
  <circle cx="34" cy="25" r="6.5" fill="#f87171"/>
  <circle cx="56" cy="25" r="6.5" fill="#fbbf24"/>
  <circle cx="78" cy="25" r="6.5" fill="#34d399"/>
  <text x="500" y="30" text-anchor="middle" class="mono" style="font-size:14px" fill="#64748b">tolib@dushanbe: ~ — zsh</text>

  <!-- 1: whoami -->
  <g clip-path="url(#t1)" class="mono">
    <text x="30" y="84"><tspan class="user">tolib@dushanbe</tspan><tspan class="cmd">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ whoami</tspan></text>
  </g>
  <g class="mono" opacity="0">
    <set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/>
    <text x="30" y="112"><tspan class="hl" filter="url(#glow)">Tolib</tspan><tspan class="out"> — Python &amp; full-stack developer · Dushanbe, Tajikistan</tspan></text>
  </g>

  <!-- 2: focus -->
  <g clip-path="url(#t2)" class="mono">
    <text x="30" y="152"><tspan class="user">tolib@dushanbe</tspan><tspan class="cmd">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ cat focus.txt</tspan></text>
  </g>
  <g class="mono" opacity="0">
    <set attributeName="opacity" to="1" begin="3.2s" fill="freeze"/>
    <text x="30" y="180" class="out">AI integrations · automation · Linux desktop hacking · payment kiosks &amp; hardware</text>
  </g>

  <!-- 3: stack -->
  <g clip-path="url(#t3)" class="mono">
    <text x="30" y="220"><tspan class="user">tolib@dushanbe</tspan><tspan class="cmd">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ ls ~/stack</tspan></text>
  </g>
  <g class="mono" opacity="0">
    <set attributeName="opacity" to="1" begin="5.0s" fill="freeze"/>
    <text x="30" y="248"><tspan class="hl">python/</tspan><tspan class="out">  </tspan><tspan class="pink">typescript/</tspan><tspan class="out">  </tspan><tspan class="hl">flutter/</tspan><tspan class="out">  </tspan><tspan class="pink">c++/</tspan><tspan class="out">  </tspan><tspan class="hl">qt/</tspan><tspan class="out">  </tspan><tspan class="pink">docker/</tspan><tspan class="out">  </tspan><tspan class="hl">arch+hyprland/</tspan></text>
  </g>

  <!-- 4: prompt with cursor -->
  <g clip-path="url(#t4)" class="mono">
    <text x="30" y="290"><tspan class="user">tolib@dushanbe</tspan><tspan class="cmd">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ ./build --next-idea</tspan></text>
  </g>
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="6.5s" fill="freeze"/>
    <rect x="422" y="276" width="10" height="19" class="cursor"/>
  </g>
</svg>
